<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلة حاسبة بروف</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #121212; font-family: sans-serif; margin: 0; }
        .calculator { background: #1e1e1e; padding: 20px; border-radius: 20px; box-shadow: 0px 10px 30px rgba(0,0,0,0.5); width: 300px; }
        #display { width: 100%; height: 60px; background: #2d2d2d; border: none; border-radius: 10px; color: #fff; font-size: 2rem; text-align: right; padding: 10px; box-sizing: border-box; margin-bottom: 20px; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 20px; font-size: 1.5rem; border: none; border-radius: 10px; cursor: pointer; background: #333; color: #fff; }
        button:active { filter: brightness(1.2); }
        .operator { background: #ff9f0a; color: white; }
        .clear { background: #a5a5a5; color: black; }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" readonly>
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="appendValue('/')" class="operator">/</button>
        <button onclick="appendValue('*')" class="operator">*</button>
        <button onclick="appendValue('-')" class="operator">-</button>
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('+')" class="operator">+</button>
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button onclick="calculate()" style="grid-row: span 2; height: 100%;" class="operator">=</button>
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
        <button onclick="appendValue('.')">.</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');
    function appendValue(val) { display.value += val; }
    function clearDisplay() { display.value = ''; }
    function calculate() { try { display.value = eval(display.value); } catch { display.value = 'خطأ'; } }
</script>

</body>
</html>
